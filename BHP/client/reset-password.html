<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | RealtyAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="predict-page">
    <div class="predict-bg"></div>

    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container custom-container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-house-signal me-2 brand-icon"></i>
                <span class="brand-text">RealtyAI</span>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card glass-card fade-in-up" id="resetCard">
            <h2 class="auth-title text-center">Reset <span class="text-accent">Password</span></h2>
            <p class="text-center text-secondary-light mb-4">Please enter your new password below.</p>
            
            <form id="resetForm">
                <div class="mb-4">
                    <label class="form-label">New Password</label>
                    <div class="password-field-container">
                        <input type="password" id="password" class="form-control form-control-glass input-focus-glow" 
                               placeholder="••••••••" required oninput="checkPasswordStrength(this.value)">
                        <i class="fa-solid fa-eye-slash password-toggle" id="togglePassword" onclick="togglePassword('password', 'togglePassword')"></i>
                    </div>
                    <div id="strength-bar" class="password-strength"></div>
                    <span id="strength-text" class="strength-text"></span>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <div class="password-field-container">
                        <input type="password" id="confirmPassword" class="form-control form-control-glass input-focus-glow" 
                               placeholder="••••••••" required>
                        <i class="fa-solid fa-eye-slash password-toggle" id="toggleConfirm" onclick="togglePassword('confirmPassword', 'toggleConfirm')"></i>
                    </div>
                </div>

                <button type="submit" id="resetBtn" class="btn btn-accent w-100 py-3 mt-2 btn-glow">
                    Update Password <i class="fa-solid fa-shield-halved ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
