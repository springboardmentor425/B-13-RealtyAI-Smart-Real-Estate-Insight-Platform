<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RealtyAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="predict-page">
    <div class="predict-bg"></div>

    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container custom-container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-house-signal me-2 brand-icon"></i>
                <span class="brand-text">RealtyAI</span>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <!-- Request Form -->
        <div class="auth-card glass-card fade-in-up" id="forgotCard">
            <h2 class="auth-title text-center">Forgot <span class="text-accent">Password?</span></h2>
            <p class="text-center text-secondary-light mb-4">Enter your email and we'll send you a link to reset your password.</p>
            
            <form id="forgotForm">
                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control form-control-glass input-focus-glow" placeholder="name@example.com" required>
                </div>
                <button type="submit" id="forgotBtn" class="btn btn-accent w-100 py-3 mt-2 btn-glow">
                    Send Reset Link <i class="fa-solid fa-paper-plane ms-2"></i>
                </button>
            </form>
            
            <p class="text-center mt-4 text-secondary-light">
                Remember your password? <a href="login.html" class="text-accent text-decoration-none">Back to Login</a>
            </p>
        </div>

        <!-- Success Screen (Hidden by default) -->
        <div class="auth-card glass-card fade-in-up d-none" id="successCard">
            <div class="text-center">
                <div class="mb-4">
                    <i class="fa-solid fa-envelope-circle-check text-accent" style="font-size: 4rem; filter: drop-shadow(0 0 15px var(--accent-glow));"></i>
                </div>
                <h2 class="auth-title">Email <span class="text-accent">Sent!</span></h2>
                <p class="text-secondary-light mb-4">We've sent a password reset link to your email. Please check your inbox (and spam folder).</p>
                <div class="mb-4">
                    <div class="loading-bar-container mx-auto" style="width: 100%;">
                        <div class="loading-bar" style="width: 100%; transition: width 2s linear;"></div>
                    </div>
                </div>
                <a href="login.html" class="btn btn-outline-light w-100 py-3">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
