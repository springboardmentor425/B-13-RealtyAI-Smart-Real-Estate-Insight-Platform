<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | RealtyAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="predict-page">
    <div class="predict-bg"></div>

    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container custom-container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fa-solid fa-house-signal me-2 brand-icon"></i>
                <span class="brand-text">RealtyAI</span>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card glass-card" data-aos="fade-up">
            <h2 class="auth-title text-center">Verify <span class="text-accent">Email</span></h2>
            <p class="text-center text-secondary-light mb-4">Enter the 6-digit OTP sent to your email.</p>
            <form id="verifyForm">
                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="verifyEmail" class="form-control form-control-glass input-focus-glow" placeholder="name@example.com" readonly>
                </div>
                <div class="mb-4">
                    <label class="form-label">OTP Code</label>
                    <input type="text" id="otp" class="form-control form-control-glass text-center fs-3 letter-spacing-lg input-focus-glow" placeholder="123456" maxlength="6" required>
                </div>
                <button type="submit" id="verifyBtn" class="btn btn-accent w-100 py-3 mt-2 btn-glow">
                    Verify & Continue <i class="fa-solid fa-shield-check ms-2"></i>
                </button>
            </form>
            <p class="text-center mt-4 text-secondary-light">
                Didn't receive code? <a href="#" class="text-accent text-decoration-none" onclick="resendOtp()">Resend</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
